<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geely EX2 Charging Tracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; background-color: #0B0A1A; color: white; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .history-scroll::-webkit-scrollbar { width: 6px; }
    .history-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
    .history-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script id="jsx-source" type="text/plain">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, linkWithPopup, onAuthStateChanged, signOut, signInWithCredential } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const MY_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBIOOnXGxET8lN-K6h-HRX8dyfrYQlLxZc",
      authDomain: "geely-tracker.firebaseapp.com",
      projectId: "geely-tracker",
      storageBucket: "geely-tracker.firebasestorage.app",
      messagingSenderId: "1066830584325",
      appId: "1:1066830584325:web:cf20ac2cb77d9142399a6c",
      measurementId: "G-WVJLH5HPS4"
    };

    let app = null, auth = null, db = null;
    if (MY_FIREBASE_CONFIG.apiKey) {
      try {
        app = initializeApp(MY_FIREBASE_CONFIG);
        auth = getAuth(app);
        db = getFirestore(app);
      } catch(e) { console.error("Firebase Init Error", e); }
    }
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'geely-ex2-github-app';

    const { useState, useEffect, useMemo, useRef, memo } = React;

    const getCurrentTimeStr = () => {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    };

    const getSafeISODateTime = (ts) => {
      try {
        const rawNum = Number(ts);
        const d = new Date(isNaN(rawNum) ? ts : rawNum);
        if (isNaN(d.getTime())) return new Date().toISOString().slice(0, 16);
        const tz = d.getTimezoneOffset() * 60000;
        return new Date(d.getTime() - tz).toISOString().slice(0, 16);
      } catch(e) {
        return new Date().toISOString().slice(0, 16);
      }
    };

    const EV_SPECS = { 
      CAPACITY: 39.4, 
      MAX_AC_POWER: 6.6, 
      MAX_DC_POWER: 70.0, 
      AC_EFFICIENCY: 0.94, 
      DC_EFFICIENCY: 0.95, 
      TRICKLE_RATE: 0.35, 
      AC_COST_EFFICIENCY: 0.90, 
      DC_COST_EFFICIENCY: 18.912 / 21.728,
      AC_VAMPIRE_DRAIN_KW: 0.3
    };

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const paths = {
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
        clock: <><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 16 14" /></>,
        wallet: <><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4" /><path d="M4 6v12c0 1.1.9 2 2 2h14v-8" /><path d="M18 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4z" /></>,
        save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></>,
        history: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></>,
        trash: <><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>,
        edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></>,
        user: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
        settings: <><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83 2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></>,
        list: <><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /></>,
        chart: <><line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" /></>,
        chevron: <polyline points="6 9 12 15 18 9" />,
        download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
        upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>
      };
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {paths[name]}
        </svg>
      );
    };

    const GoogleIcon = ({className}) => (
      <svg className={className} viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
    );

    function useSystemData(onAlertTriggered) {
      const [user, setUser] = useState(null);
      const [history, setHistory] = useState([]);
      const [isReady, setIsReady] = useState(false);
      const [storageMode, setStorageMode] = useState('local'); 
      const [isAuthLoading, setIsAuthLoading] = useState(false);
      
      const deletedIdsRef = useRef(new Set());
      const deletedSignaturesRef = useRef(new Set());

      const loadLocalData = () => {
        const savedData = localStorage.getItem('geely_ex2_history');
        if (savedData) { 
          try { 
            const parsed = JSON.parse(savedData);
            const cleaned = parsed.map((item, idx) => ({
              ...item,
              id: item.id ? String(item.id) : ('loc_' + (item.timestamp || Date.now()) + '_' + idx)
            })).filter(item => {
              if (deletedIdsRef.current.has(item.id)) return false;
              const sig = `${Number(item.timestamp)}_${Number(item.cost)}`;
              if (deletedSignaturesRef.current.has(sig)) return false;
              return true;
            });
            setHistory(cleaned); 
          } catch(e){ setHistory([]); } 
        } else {
          setHistory([]);
        }
        setUser({ uid: 'local_user', isAnonymous: true });
        setStorageMode('local');
        setIsReady(true);
      };

      useEffect(() => {
        if (!auth) return loadLocalData();
        return onAuthStateChanged(auth, async (u) => {
          if (u) { 
            setUser(u); 
            setStorageMode(u.isAnonymous ? 'local' : 'cloud'); 
          } else {
            try { await signInAnonymously(auth); } 
            catch (e) { loadLocalData(); }
          }
        });
      }, []);

      useEffect(() => {
        if (!user || !db || user.uid === 'local_user' || user.isAnonymous) {
          if (storageMode === 'local' && user?.uid !== 'local_user') loadLocalData();
          return;
        }

        const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory');
        
        // Wipe local storage so it NEVER re-uploads old data
        localStorage.removeItem('geely_ex2_history'); 

        return onSnapshot(colRef, (snapshot) => {
          const rawData = snapshot.docs.map(docSnap => ({ 
            ...docSnap.data(), 
            id: String(docSnap.id) 
          })).filter(item => {
            if (deletedIdsRef.current.has(item.id)) return false;
            const sig = `${Number(item.timestamp)}_${Number(item.cost)}`;
            if (deletedSignaturesRef.current.has(sig)) return false;
            return true;
          });

          rawData.sort((a, b) => Number(b.timestamp) - Number(a.timestamp));
          setHistory(rawData);
          setIsReady(true);
        }, (err) => { 
          console.error("Snapshot error:", err);
          setStorageMode('local'); 
          loadLocalData(); 
        });
      }, [user, storageMode]);

      const handleGoogleSignIn = async () => {
        if (!auth) return;
        if (window.self !== window.top) {
          return onAlertTriggered({ title: "Security Warning", message: "Please open in a direct tab to login." });
        }
        setIsAuthLoading(true);
        const provider = new GoogleAuthProvider();
        try {
          if (auth.currentUser?.isAnonymous) {
            try { await linkWithPopup(auth.currentUser, provider); } 
            catch (linkErr) {
              if (linkErr.code === 'auth/credential-already-in-use' || linkErr.code === 'auth/email-already-in-use') {
                const credential = GoogleAuthProvider.credentialFromError(linkErr);
                if (credential) await signInWithCredential(auth, credential);
                else await signInWithPopup(auth, provider);
              } else { throw linkErr; }
            }
          } else { await signInWithPopup(auth, provider); }
        } catch (e) {
          if (e.code !== 'auth/popup-closed-by-user') {
            onAlertTriggered({ title: "Login Failed", message: e.message });
          }
        } finally { setIsAuthLoading(false); }
      };

      const handleSignOut = async () => {
        if (!auth) return;
        try { await signOut(auth); loadLocalData(); } catch (e) {}
      };

      // ADD RECORD (Optimistic UI - No HANGING)
      const addRecord = async (record) => {
        const cleanRecord = { ...record };
        if (storageMode === 'cloud' && db && user?.uid && user.uid !== 'local_user' && !user.isAnonymous) {
          
          // 1. Instantly update UI with a temporary ID
          const tempId = 'temp_' + Date.now();
          const newRecord = { id: tempId, ...cleanRecord };
          setHistory(prev => [newRecord, ...prev].sort((a,b) => Number(b.timestamp) - Number(a.timestamp)));

          // 2. Background Sync (Fire-and-Forget)
          addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory'), cleanRecord)
            .catch(error => {
              console.error("Firebase Add Error:", error);
              if (error.code === 'permission-denied') {
                onAlertTriggered({ title: "Cloud Denied", message: "Firebase Rules ปฏิเสธการบันทึกข้อมูล (อาจหมดอายุ 30 วัน)" });
              }
            });
          
          return true;
        } else {
          const newRecord = { id: 'loc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7), ...cleanRecord };
          const updated = [newRecord, ...history].sort((a,b) => Number(b.timestamp) - Number(a.timestamp));
          setHistory(updated);
          localStorage.setItem('geely_ex2_history', JSON.stringify(updated));
          return true;
        }
      };

      // DELETE RECORD (Optimistic UI - NO HANGING)
      const deleteRecord = async (id, targetItem) => {
        const targetId = String(id).trim();
        const idsToDelete = [targetId];
        
        // Find ghost duplicates locally
        history.forEach(item => {
          if (targetItem && String(item.id) !== targetId) {
            const isSameTime = Number(item.timestamp) === Number(targetItem.timestamp);
            const isSameCost = Math.abs(Number(item.cost) - Number(targetItem.cost)) < 0.05;
            if (isSameTime && isSameCost) {
              idsToDelete.push(String(item.id));
            }
          }
        });

        const uniqueIds = Array.from(new Set(idsToDelete));

        // 1. OPTIMISTIC UI INSTANT WIPE (Blocks onSnapshot from bringing it back)
        uniqueIds.forEach(dId => deletedIdsRef.current.add(dId));
        if (targetItem) {
          deletedSignaturesRef.current.add(`${Number(targetItem.timestamp)}_${Number(targetItem.cost)}`);
        }
        setHistory(prev => prev.filter(item => !uniqueIds.includes(String(item.id))));

        // 2. BACKGROUND SYNC (Fire-and-Forget)
        if (storageMode === 'cloud' && db && user?.uid && user.uid !== 'local_user' && !user.isAnonymous) {
           uniqueIds.forEach(docId => {
              deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory', docId))
                .catch(error => {
                  console.error("Firebase Delete Error:", error);
                  if (error.code === 'permission-denied') {
                    onAlertTriggered({ title: "Cloud Denied", message: "Firebase Rules ของคุณหมดอายุ 30 วัน ทำให้การลบไม่สำเร็จบนเซิร์ฟเวอร์ โปรดอัปเดต Rules" });
                  }
                });
           });
        }

        // 3. Local sync
        if (storageMode === 'local' || user?.isAnonymous || user?.uid === 'local_user') {
          const currentLocal = localStorage.getItem('geely_ex2_history');
          if (currentLocal) {
            try {
              const parsed = JSON.parse(currentLocal);
              const filtered = parsed.filter(item => !uniqueIds.includes(String(item.id)));
              localStorage.setItem('geely_ex2_history', JSON.stringify(filtered));
            } catch(e){}
          }
        }
        
        return true; 
      };

      // UPDATE RECORD (Optimistic UI - NO HANGING)
      const updateRecord = async (id, newCost, newTimestamp, targetItem) => {
        const targetId = String(id).trim();
        const numericCost = Number(newCost) || 0;
        const numericTs = Number(newTimestamp) || Date.now();

        const idsToDelete = [];
        history.forEach(item => {
          if (targetItem && String(item.id) !== targetId) {
            const isSameTime = Number(item.timestamp) === Number(targetItem.timestamp);
            const isSameCost = Math.abs(Number(item.cost) - Number(targetItem.cost)) < 0.05;
            if (isSameTime && isSameCost) {
              idsToDelete.push(String(item.id));
            }
          }
        });
        const uniqueIds = Array.from(new Set(idsToDelete));

        // 1. OPTIMISTIC UI INSTANT WIPE & UPDATE
        uniqueIds.forEach(dId => deletedIdsRef.current.add(dId));
        if (targetItem) {
          deletedSignaturesRef.current.add(`${Number(targetItem.timestamp)}_${Number(targetItem.cost)}`);
        }
        
        setHistory(prev => {
          const next = prev.map(item => {
            if (String(item.id) === targetId || uniqueIds.includes(String(item.id))) {
              return { ...item, id: targetId, cost: numericCost, timestamp: numericTs };
            }
            return item;
          });
          return next.filter((item, index, self) => index === self.findIndex((t) => String(t.id) === String(item.id)))
                     .sort((a,b) => Number(b.timestamp) - Number(a.timestamp));
        });

        // 2. BACKGROUND SYNC (Fire-and-Forget)
        if (storageMode === 'cloud' && db && user?.uid && user.uid !== 'local_user' && !user.isAnonymous) {
            uniqueIds.forEach(docId => {
              if (docId !== targetId) {
                deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory', docId)).catch(e=>console.error(e));
              }
            });
            updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory', targetId), {
              cost: numericCost, timestamp: numericTs
            }).catch(error => {
              console.error("Firebase Update Error:", error);
              if (error.code === 'permission-denied') {
                onAlertTriggered({ title: "Cloud Denied", message: "Firebase Rules หมดอายุ ทำให้แก้ไขไม่สำเร็จบนเซิร์ฟเวอร์" });
              }
            });
        }

        // 3. Local sync
        if (storageMode === 'local' || user?.isAnonymous || user?.uid === 'local_user') {
          const currentLocal = localStorage.getItem('geely_ex2_history');
          if (currentLocal) {
            try {
              const parsed = JSON.parse(currentLocal);
              const updatedLocal = parsed.map(item => String(item.id) === targetId ? { ...item, cost: numericCost, timestamp: numericTs } : item);
              localStorage.setItem('geely_ex2_history', JSON.stringify(updatedLocal));
            } catch(e){}
          }
        }
        
        return true;
      };

      const importRecords = async (importedList) => {
        if (!Array.isArray(importedList) || importedList.length === 0) return 0;
        let addedCount = 0;
        const newItemsToSave = [];

        for (const rawItem of importedList) {
          if (!rawItem.timestamp || rawItem.cost === undefined) continue;
          const cleanItem = {
            timestamp: Number(rawItem.timestamp) || Date.now(),
            cost: Number(rawItem.cost) || 0,
            startSoC: Number(rawItem.startSoC) || 0,
            targetSoC: Number(rawItem.targetSoC) || 100,
            chargerType: rawItem.chargerType || 'AC',
            power: rawItem.power || '10A',
            pricePerUnit: Number(rawItem.pricePerUnit) || 4.5
          };

          if (storageMode === 'cloud' && db && user?.uid && user.uid !== 'local_user' && !user.isAnonymous) {
            // Background sync
            addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory'), cleanItem).catch(e=>console.error(e));
          } else {
            newItemsToSave.push({ id: 'imp_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7), ...cleanItem });
          }
          addedCount++;
        }

        if (storageMode === 'local' && newItemsToSave.length > 0) {
          const merged = [...newItemsToSave, ...history].sort((a, b) => Number(b.timestamp) - Number(a.timestamp));
          setHistory(merged);
          localStorage.setItem('geely_ex2_history', JSON.stringify(merged));
        }

        return addedCount;
      };

      return { user, history, isReady, storageMode, isAuthLoading, handleGoogleSignIn, handleSignOut, addRecord, deleteRecord, updateRecord, importRecords };
    }

    function useChargeCalculation(currentSoC, targetSoC, chargerType, dcPower, acPower, acInputMode, acAmps, pricePerUnit, calibVoltage, calibOBC) {
      return useMemo(() => {
        let pwr = 0;
        if (chargerType === 'AC') {
          pwr = acInputMode === 'A' ? (acAmps * 0.94 * calibVoltage) / 1000 : Number(acPower) || 0;
        } else {
          pwr = Number(dcPower) || 0;
        }

        if (currentSoC >= targetSoC) return { hours: 0, minutes: 0, error: "แบตเตอรี่ถึงเป้าหมายแล้ว", actualPower: 0, bottleneck: null, cost: 0 };
        if (pwr <= 0) return { hours: 0, minutes: 0, error: "ข้อมูลกำลังไฟไม่ถูกต้อง", actualPower: 0, bottleneck: null, cost: 0 };

        const energyNeeded = EV_SPECS.CAPACITY * ((targetSoC - currentSoC) / 100);
        let maxCap = chargerType === 'AC' ? EV_SPECS.MAX_AC_POWER : EV_SPECS.MAX_DC_POWER;
        let actualPower = Math.min(pwr, maxCap);
        let bottleneck = pwr > maxCap ? `รถรับไฟได้สูงสุด ${maxCap} kW` : 'จำกัดตามกำลังเครื่องชาร์จ';

        let timeHours = 0;
        if (chargerType === 'AC') {
          const eff = calibOBC / 100;
          if (currentSoC < 90) timeHours += (EV_SPECS.CAPACITY * ((Math.min(targetSoC, 90) - currentSoC) / 100)) / (actualPower * eff);
          if (targetSoC > 90) timeHours += (EV_SPECS.CAPACITY * ((targetSoC - Math.max(currentSoC, 90)) / 100)) / (actualPower * eff * 0.85);
        } else {
          const effDc = actualPower * EV_SPECS.DC_EFFICIENCY;
          if (targetSoC <= 80) timeHours = energyNeeded / effDc;
          else if (currentSoC >= 80) timeHours = energyNeeded / (effDc * EV_SPECS.TRICKLE_RATE);
          else timeHours = ((EV_SPECS.CAPACITY * ((80 - currentSoC) / 100)) / effDc) + ((EV_SPECS.CAPACITY * ((targetSoC - 80) / 100)) / (effDc * EV_SPECS.TRICKLE_RATE));
        }

        const totalMins = Math.round(timeHours * 60);

        let cost = 0;
        if (chargerType === 'AC') {
          cost = ((energyNeeded / EV_SPECS.AC_COST_EFFICIENCY) + (timeHours * EV_SPECS.AC_VAMPIRE_DRAIN_KW)) * (Number(pricePerUnit) || 0);
        } else {
          cost = (energyNeeded / EV_SPECS.DC_COST_EFFICIENCY) * (Number(pricePerUnit) || 0);
        }

        return { hours: Math.floor(totalMins / 60), minutes: totalMins % 60, actualPower, bottleneck, error: null, cost };
      }, [currentSoC, targetSoC, chargerType, dcPower, acPower, acInputMode, acAmps, pricePerUnit, calibVoltage, calibOBC]);
    }

    const GaugeCanvas = memo(({ currentSoC, targetSoC, chargerType }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const ctx = canvasRef.current?.getContext('2d');
        if (!ctx) return;
        const w = 320, h = 160, dpr = window.devicePixelRatio || 1;
        canvasRef.current.width = w * dpr; canvasRef.current.height = h * dpr;
        ctx.scale(dpr, dpr); ctx.clearRect(0, 0, w, h);

        const cx = w / 2, cy = h - 10, r = w / 2 - 30;
        const grad = ctx.createLinearGradient(0, cy, w, cy);
        grad.addColorStop(0, '#06b6d4'); grad.addColorStop(0.5, '#8b5cf6'); grad.addColorStop(1, '#ec4899');

        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.stroke();
        
        const cAngle = Math.PI + (Math.PI * (currentSoC / 100));
        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, cAngle); ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.strokeStyle = grad; 
        ctx.shadowColor = '#ec4899'; ctx.shadowBlur = 12; ctx.stroke(); ctx.shadowBlur = 0;

        if (targetSoC > currentSoC) {
          const tAngle = Math.PI + (Math.PI * (targetSoC / 100));
          ctx.beginPath(); ctx.arc(cx, cy, r, cAngle, tAngle); ctx.lineWidth = 18; ctx.setLineDash([4, 4]);
          const forecastGrad = ctx.createLinearGradient(0, 0, w, 0);
          forecastGrad.addColorStop(0, '#a855f7'); forecastGrad.addColorStop(1, targetSoC > 80 ? '#fb923c' : '#ec4899');
          ctx.strokeStyle = forecastGrad; ctx.stroke(); ctx.setLineDash([]);
        }

        if (chargerType === 'DC') {
          const markerAngle = Math.PI + (Math.PI * 0.8);
          const mx = cx + Math.cos(markerAngle) * (r - 14), my = cy + Math.sin(markerAngle) * (r - 14);
          const mox = cx + Math.cos(markerAngle) * (r + 14), moy = cy + Math.sin(markerAngle) * (r + 14);
          ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(mox, moy); ctx.lineWidth = 4; ctx.strokeStyle = '#f43f5e'; ctx.shadowColor = '#f43f5e'; ctx.shadowBlur = 8; ctx.stroke(); ctx.shadowBlur = 0;
          ctx.fillStyle = '#fca5a5'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('BMS LIMIT', mox + 24, moy - 4);
        }
      }, [currentSoC, targetSoC, chargerType]);

      return <canvas ref={canvasRef} className="w-full max-w-[320px] aspect-[2/1] z-10 drop-shadow-2xl" />;
    });

    const RecordItemCard = ({ item, activeItemId, setActiveItemId, editingId, setEditingId, editCost, setEditCost, editDateTime, setEditDateTime, systemDB, onDeleteRequest }) => {

                    e.stopPropagation();

                    e.preventDefault();

                <div>

    function App() {
      const [appAlert, setAppAlert] = useState(null);
      const systemDB = useSystemData(setAppAlert);
      
      const [showHistory, setShowHistory] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [showCalib, setShowCalib] = useState(false);
      const [calibVoltage, setCalibVoltage] = useState(229); 
      const [calibOBC, setCalibOBC] = useState(94); 

      const [currentSoC, setCurrentSoC] = useState(30);
      const [targetSoC, setTargetSoC] = useState(80);
      const [chargerType, setChargerType] = useState('AC');
      const [dcPower, setDcPower] = useState(120);
      const [acPower, setAcPower] = useState(7);
      const [acInputMode, setAcInputMode] = useState('A'); 
      const [acAmps, setAcAmps] = useState(10); 
      const [scheduleMode, setScheduleMode] = useState('START_AT'); 
      const [targetTime, setTargetTime] = useState('06:30'); 
      const [userStartTime, setUserStartTime] = useState(getCurrentTimeStr()); 
      const [pricePerUnit, setPricePerUnit] = useState(4.5);

      const [historyTab, setHistoryTab] = useState("records");
      const [selectedMonthFilter, setSelectedMonthFilter] = useState("ALL");
      const [expandedMonthKey, setExpandedMonthKey] = useState(null);

      const getCurrentMonthKey = () => {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
      };
      const [activeItemId, setActiveItemId] = useState(null);
      const [editingId, setEditingId] = useState(null);
      const [editCost, setEditCost] = useState("");
      const [editDateTime, setEditDateTime] = useState("");
      const [isSaving, setIsSaving] = useState(false);
      const [itemToDelete, setItemToDelete] = useState(null);

      const fileInputRef = useRef(null);

      const calcDetails = useChargeCalculation(currentSoC, targetSoC, chargerType, dcPower, acPower, acInputMode, acAmps, pricePerUnit, calibVoltage, calibOBC);

      const groupedHistory = useMemo(() => {
        const groups = {};
        systemDB.history.forEach(item => {
          const date = new Date(Number(item.timestamp) || item.timestamp);
          const monthYear = date.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });
          const sortKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;

          if (!groups[sortKey]) groups[sortKey] = { key: sortKey, label: monthYear, items: [], total: 0, totalKwh: 0 };
          groups[sortKey].items.push(item);
          groups[sortKey].total += Number(item.cost) || 0;
          groups[sortKey].totalKwh += (Number(item.cost) || 0) / (Number(item.pricePerUnit) || 4.5);
        });

        return Object.entries(groups).sort(([a], [b]) => b.localeCompare(a)).map(([_, v]) => v);
      }, [systemDB.history]);

      const filteredRecords = useMemo(() => {
        if (selectedMonthFilter === 'ALL') return systemDB.history;
        const targetGroup = groupedHistory.find(g => g.key === selectedMonthFilter);
        return targetGroup ? targetGroup.items : [];
      }, [systemDB.history, groupedHistory, selectedMonthFilter]);

      const filteredTotalCost = useMemo(() => {
        return filteredRecords.reduce((sum, item) => sum + (Number(item.cost) || 0), 0);
      }, [filteredRecords]);

      const schedule = useMemo(() => {
        if (calcDetails.error || (!calcDetails.hours && !calcDetails.minutes)) return null;
        const totalChargeMinutes = (calcDetails.hours * 60) + calcDetails.minutes;
        if (scheduleMode === 'FINISH_BY') {
          const [tH, tM] = targetTime.split(':').map(Number);
          let startMins = (tH * 60 + tM) - totalChargeMinutes;
          let offset = '';
          if (startMins < 0) { startMins = (24 * 60) + (startMins % (24 * 60)); offset = '(คืนก่อนหน้า)'; }
          return {
            inputLabel: `ต้องการใช้รถเวลา (${targetSoC}%)`, outputLabel: 'ตั้งเวลาเริ่มชาร์จ (ในแอพ)',
            outputTime: `${String(Math.floor(startMins / 60) % 24).padStart(2, '0')}:${String(startMins % 60).padStart(2, '0')}`, dayOffset: offset,
            inputValue: targetTime, setInputValue: setTargetTime
          };
        } else {
          const [sH, sM] = userStartTime.split(':').map(Number);
          let endMins = (sH * 60 + sM) + totalChargeMinutes;
          return {
            inputLabel: 'เสียบสายเริ่มชาร์จเวลา', outputLabel: `ชาร์จเสร็จถึงเป้า (${targetSoC}%)`,
            outputTime: `${String(Math.floor(endMins / 60) % 24).padStart(2, '0')}:${String(endMins % 60).padStart(2, '0')}`,
            dayOffset: endMins >= 24 * 60 ? '(วันถัดไป)' : '', inputValue: userStartTime, setInputValue: setUserStartTime
          };
        }
      }, [calcDetails, targetTime, userStartTime, scheduleMode, targetSoC]);

      const handleSaveSession = async () => {
        if (!systemDB.user || calcDetails.error || isSaving) return;
        setIsSaving(true);
        try {
          const success = await systemDB.addRecord({
            timestamp: Date.now(),
            cost: calcDetails.cost,
            startSoC: currentSoC,
            targetSoC,
            chargerType,
            power: chargerType === 'AC' ? (acInputMode === 'A' ? `${acAmps}A` : `${acPower}kW`) : `${dcPower}kW`,
            pricePerUnit
          });
          if (success) {
             setAppAlert({ title: "สำเร็จ", message: "บันทึกประวัติการชาร์จเรียบร้อยแล้ว" });
          }
        } finally {
          setIsSaving(false);
        }
      };

      const handleExportBackup = () => {
        if (systemDB.history.length === 0) {
          return setAppAlert({ title: "ไม่มีข้อมูล", message: "ไม่มีประวัติการชาร์จสำหรับส่งออก Backup" });
        }
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(systemDB.history, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `geely_ex2_backup_${new Date().toISOString().slice(0, 10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      };

      const handleImportFile = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (!Array.isArray(parsed)) throw new Error("รูปแบบไฟล์ Backup ไม่ถูกต้อง (ต้องเป็น JSON Array)");
            const count = await systemDB.importRecords(parsed);
            setAppAlert({ title: "นำเข้าข้อมูลสำเร็จ", message: `นำเข้าประวัติการชาร์จจำนวน ${count} รายการเรียบร้อยแล้ว` });
          } catch (err) {
            setAppAlert({ title: "นำเข้าไม่สำเร็จ", message: err.message || "ไม่สามารถอ่านไฟล์ JSON ได้" });
          } finally {
            if (fileInputRef.current) fileInputRef.current.value = '';
          }
        };
        reader.readAsText(file);
      };

      const acPresets = [ {label: 'บ้าน Off-Peak', val: 2.6}, {label: 'ไฟบ้านปกติ', val: 4.5}, {label: 'บ้าน On-Peak', val: 5.8}, {label: 'AC สาธารณะ', val: 5.9} ];

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-[#0B0A1A] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-fuchsia-900/40 via-[#0B0A1A] to-cyan-900/30">
          <AppAlertModal alertData={appAlert} onClose={() => setAppAlert(null)} />
          
          <div className="bg-[#120F24]/60 backdrop-blur-3xl w-full max-w-md rounded-[32px] border border-white/10 overflow-hidden relative p-6 space-y-6 shadow-[0_0_80px_-20px_rgba(236,72,153,0.3)]">
            
            {/* Header */}
            <div className="flex justify-between items-center border-b border-white/5 pb-4">
              <div>
                <h1 className="text-2xl font-black flex items-center gap-2">
                  <Icon name="zap" className="w-6 h-6 text-fuchsia-400 drop-shadow-[0_0_12px_rgba(236,72,153,0.8)]" />
                  <span className="bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 via-fuchsia-400 to-pink-500">Geely EX2</span>
                </h1>
                <p className="text-[10px] text-purple-200/60 uppercase font-bold tracking-wider">HyperCharge Tracker</p>
              </div>
              <div className="flex gap-2">
                <button 
                  onClick={() => setShowAuthModal(true)} 
                  className={`p-2.5 rounded-xl border transition-all relative ${systemDB.storageMode === 'cloud' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-white/5 border-white/10 text-cyan-300'}`}
                  title="สถานะโปรไฟล์ / เข้าสู่ระบบ"
                >
                  <Icon name="user" />
                  {systemDB.storageMode === 'cloud' && <span className="absolute top-1 right-1 w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>}
                </button>
                <button onClick={() => setShowCalib(!showCalib)} className={`p-2.5 rounded-xl border transition-all ${showCalib ? 'bg-fuchsia-500/20 border-fuchsia-500/50 text-fuchsia-300' : 'bg-white/5 border-white/10 text-cyan-300'}`} title="ตั้งค่าปรับแต่งวิศวกรรมไฟฟ้า">
                  <Icon name="settings" />
                </button>
                <button onClick={() => { setShowHistory(true); setActiveItemId(null); }} className="p-2.5 bg-white/5 rounded-xl border border-white/10 text-cyan-300 relative">
                  <Icon name="history" />
                  {systemDB.history.length > 0 && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-fuchsia-500 rounded-full animate-pulse border border-[#120F24]"></span>}
                </button>
              </div>

            {/* Calibration Accordion Panel */}
            {showCalib && (
              <div className="p-4 bg-gradient-to-b from-[#18152e] to-[#120F24] rounded-2xl border border-white/10 space-y-3">

                  <span className="text-xs font-black text-fuchsia-400 uppercase tracking-wider flex items-center gap-1.5"><Icon name="settings" className="w-4 h-4" /> ปรับแก้แรงดันไฟและความแม่นยำ</span>
                  <button onClick={() => { setCalibVoltage(229); setCalibOBC(94); }} className="text-[10px] text-cyan-300 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">คืนค่าโรงงาน</button>
                </div>
                <div>
                  <div className="flex justify-between text-xs text-gray-300 mb-1"><span>แรงดันไฟฟ้า AC (Voltage)</span><span className="text-cyan-400 font-mono font-bold">{calibVoltage} V</span></div>
                  <input type="range" min="200" max="240" step="1" value={calibVoltage} onChange={(e) => setCalibVoltage(Number(e.target.value))} className="w-full h-2 bg-white/10 rounded appearance-none cursor-pointer [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:bg-cyan-400 [&::-webkit-slider-thumb]:rounded-full" />
                </div>

                </div>
              </div>

            {/* Main Visual Arc & Time */}
            <div className="flex flex-col items-center">

                  <span className="text-[38px] leading-none font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-pink-200">{targetSoC}%</span>
                  <span className="block text-[9px] font-bold text-fuchsia-400 uppercase tracking-widest bg-fuchsia-500/10 px-2.5 py-0.5 rounded-full border border-fuchsia-500/20 mt-1">Target</span>
                </div>
              </div>

              <div className="text-purple-300/80 font-semibold mb-1 flex items-center gap-1.5 text-[10px] uppercase tracking-widest bg-white/5 px-3 py-1 rounded-full border border-white/5">
                <Icon name="clock" className="w-3.5 h-3.5 text-cyan-400" /> เวลาชาร์จโดยประมาณ

                        <button 
                          onClick={() => setSelectedMonthFilter(getCurrentMonthKey())} 
                          className={`px-2 py-1 text-[10px] font-bold rounded-lg transition-all ${selectedMonthFilter === getCurrentMonthKey() ? 'bg-fuchsia-500 text-black font-black' : 'bg-fuchsia-500/10 text-fuchsia-300 border border-fuchsia-500/20'}`}
                        >
                          ⚡ เดือนนี้
                        </button>
                      </div>
                      <select 
                        value={selectedMonthFilter} 
                        onChange={(e) => setSelectedMonthFilter(e.target.value)}
                        className="bg-[#050B14] border border-white/10 text-cyan-300 rounded-lg px-2 py-1 text-[10px] font-bold font-mono outline-none max-w-[130px]"
                      >
                        <option value="ALL">📅 ทุกเดือน ({systemDB.history.length})</option>
                        {groupedHistory.map(g => (
                          <option key={g.key} value={g.key}>{g.label} ({g.items.length})</option>
                        ))}
                      </select>
                    </div>
                  )}

                  {/* Backup Export & Import Toolbar */}
                  <div className="flex gap-2 pt-1 border-t border-white/5">
                    <button onClick={handleExportBackup} className="flex-1 py-1.5 bg-cyan-500/20 hover:bg-cyan-500/30 text-cyan-300 border border-cyan-500/30 rounded-xl text-[10px] font-bold uppercase flex items-center justify-center gap-1 transition-all">
                      <Icon name="download" className="w-3.5 h-3.5" /> 📥 Export Backup (JSON)
                    </button>
                    <button onClick={() => fileInputRef.current?.click()} className="flex-1 py-1.5 bg-purple-500/20 hover:bg-purple-500/30 text-purple-300 border border-purple-500/30 rounded-xl text-[10px] font-bold uppercase flex items-center justify-center gap-1 transition-all">
                      <Icon name="upload" className="w-3.5 h-3.5" /> 📤 Import Backup
                    </button>
                    <input type="file" ref={fileInputRef} onChange={handleImportFile} accept=".json" className="hidden" />
                  </div>
                </div>

                {/* Scrollable Feed List */}
                <div className="flex-1 overflow-y-auto p-4 space-y-3 history-scroll">
                  {historyTab === 'records' ? (
                    <div>
                      <div className="flex justify-between text-xs font-bold text-cyan-300 uppercase border-b border-white/10 pb-2 mb-3">
                        <span>
                          {selectedMonthFilter === 'ALL' 
                            ? 'รายการทั้งหมดทุกเดือน' 
                            : (groupedHistory.find(g => g.key === selectedMonthFilter)?.label || '')}
                        </span>
                        <span className="font-mono text-emerald-400">฿{filteredTotalCost.toFixed(2)}</span>
                      </div>
                      {filteredRecords.length === 0 ? (
                        <div className="text-center text-white/30 py-12 text-xs">ไม่มีรายการชาร์จในตัวกรองนี้</div>
                      ) : (
                        filteredRecords.map(item => (
                          <RecordItemCard 
                            key={item.id} 
                            item={item} 
                            activeItemId={activeItemId} 
                            setActiveItemId={setActiveItemId} 
                            editingId={editingId} 
                            setEditingId={setEditingId} 
                            editCost={editCost} 
                            setEditCost={setEditCost} 
                            editDateTime={editDateTime} 
                            setEditDateTime={setEditDateTime} 
                            systemDB={systemDB}
                            onDeleteRequest={setItemToDelete}
                          />
                        ))
                      )}
                    </div>
                  ) : (
                    <div className="space-y-3">
                      {groupedHistory.map(group => {
                        const count = group.items.length;
                        const avg = count > 0 ? group.total / count : 0;
                        const isExpanded = expandedMonthKey === group.key;
                        return (
                          <div key={group.key} className="bg-black/40 border border-white/5 rounded-2xl overflow-hidden">
                            <div onClick={() => setExpandedMonthKey(isExpanded ? null : group.key)} className="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5">
                              <div>
                                <span className="text-[9px] text-cyan-400 font-bold uppercase block">สรุปรายเดือน</span>
                                <h3 className="text-sm font-black">{group.label}</h3>
                              </div>
                              <div className="flex items-center gap-2">
                                <span className="text-base font-black font-mono text-emerald-400">฿{group.total.toFixed(2)}</span>
                                <Icon name="chevron" className={`w-4 h-4 text-gray-400 transition-transform ${isExpanded ? 'rotate-180' : ''}`} />
                              </div>
                            </div>
                            <div className="p-3 bg-[#17142e]/30 grid grid-cols-2 gap-2 text-center text-xs border-t border-white/5">
                              <div className="bg-white/5 p-2 rounded-xl">
                                <span className="block text-[8px] text-white/40 uppercase">จำนวนครั้ง</span>
                                <span className="font-bold font-mono">{count} ครั้ง</span>
                              </div>
                              <div className="bg-white/5 p-2 rounded-xl">
                                <span className="block text-[8px] text-white/40 uppercase">เฉลี่ยต่อครั้ง</span>
                                <span className="font-bold font-mono text-amber-300">฿{avg.toFixed(2)}</span>
                              </div>
                            </div>
                            {isExpanded && (
                              <div className="p-3 bg-[#0a0815]/60 space-y-2">
                                <h4 className="text-[10px] text-cyan-400 font-bold uppercase mb-2">รายการชาร์จทั้งหมด (คลิกเพื่อแก้ไข/ลบ)</h4>
                                {group.items.map(item => (
                                  <RecordItemCard 
                                    key={item.id} 
                                    item={item} 
                                    activeItemId={activeItemId} 
                                    setActiveItemId={setActiveItemId} 
                                    editingId={editingId} 
                                    setEditingId={setEditingId} 
                                    editCost={editCost} 
                                    setEditCost={setEditCost} 
                                    editDateTime={editDateTime} 
                                    setEditDateTime={setEditDateTime} 
                                    systemDB={systemDB}
                                    onDeleteRequest={setItemToDelete}
                                  />
                                ))}
                              </div>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}

          <ConfirmDeleteModal 
            item={itemToDelete} 
            onConfirm={async () => {
              if (itemToDelete) {
                const success = await systemDB.deleteRecord(String(itemToDelete.id), itemToDelete);
                if (success) {
                  setActiveItemId(null);
                  setEditingId(null);
                  setItemToDelete(null);
                }
              }
            }} 
            onCancel={() => setItemToDelete(null)} 
          />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script type="module">
    try {
      const source = document.getElementById('jsx-source').textContent;
      const compiled = Babel.transform(source, { presets: [['react', { "runtime": "classic" }]], sourceType: "module" }).code;
      const script = document.createElement('script'); script.type = 'module'; script.text = compiled;
      document.body.appendChild(script);
    } catch (e) { console.error("Babel compilation error:", e); }
  </script>
</body>
</html>
