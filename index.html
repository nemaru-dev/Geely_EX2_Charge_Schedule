<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geely EX2 Charging Tracker</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { margin: 0; background-color: #0B0A1A; color: white; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .history-scroll::-webkit-scrollbar { width: 6px; }
    .history-scroll::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); }
    .history-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    input[type=range] { -webkit-appearance: none; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: currentColor; cursor: pointer; margin-top: -6px; box-shadow: 0 0 10px currentColor; }
    input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 2px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script id="jsx-source" type="text/plain">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, linkWithPopup, onAuthStateChanged, signOut, signInWithCredential } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const MY_FIREBASE_CONFIG = {
      apiKey: "AIzaSyBIOOnXGxET8lN-K6h-HRX8dyfrYQlLxZc", authDomain: "geely-tracker.firebaseapp.com", projectId: "geely-tracker",
      storageBucket: "geely-tracker.firebasestorage.app", messagingSenderId: "1066830584325", appId: "1:1066830584325:web:cf20ac2cb77d9142399a6c"
    };

    let app = null, auth = null, db = null;
    try { app = initializeApp(MY_FIREBASE_CONFIG); auth = getAuth(app); db = getFirestore(app); } catch(e) { console.error(e); }
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'geely-ex2-github-app';

    const { useState, useEffect, useMemo, useRef, memo } = React;

    const getCurrentTimeStr = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
    const getSafeISODateTime = (ts) => {
      try { const d = new Date(isNaN(Number(ts)) ? ts : Number(ts)); if (isNaN(d.getTime())) throw new Error(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); } 
      catch { return new Date().toISOString().slice(0, 16); }
    };

    const EV_SPECS = { CAPACITY: 39.4, MAX_AC_POWER: 6.6, MAX_DC_POWER: 70.0, DC_EFFICIENCY: 0.95, TRICKLE_RATE: 0.35, AC_COST_EFFICIENCY: 0.90, DC_COST_EFFICIENCY: 0.87, AC_VAMPIRE_DRAIN_KW: 0.3 };

    const calculateChargeStats = (currentSoC, targetSoC, chargerType, dcPower, acPower, acInputMode, acAmps, pricePerUnit, calibVoltage, calibOBC) => {
      let pwr = chargerType === 'AC' ? (acInputMode === 'A' ? (acAmps * 0.94 * calibVoltage) / 1000 : Number(acPower)||0) : (Number(dcPower)||0);
      if (currentSoC >= targetSoC) return { hours: 0, minutes: 0, error: "แบตเตอรี่ถึงเป้าหมายแล้ว", actualPower: 0, cost: 0 };
      if (pwr <= 0) return { hours: 0, minutes: 0, error: "ข้อมูลกำลังไฟไม่ถูกต้อง", actualPower: 0, cost: 0 };

      const energyNeeded = EV_SPECS.CAPACITY * ((targetSoC - currentSoC) / 100);
      let actualPower = Math.min(pwr, chargerType === 'AC' ? EV_SPECS.MAX_AC_POWER : EV_SPECS.MAX_DC_POWER);
      let bottleneck = pwr > actualPower ? `รถรับไฟได้สูงสุด ${actualPower} kW` : 'จำกัดตามกำลังเครื่องชาร์จ';
      let timeHours = 0, cost = 0;

      if (chargerType === 'AC') {
        const eff = calibOBC / 100;
        if (currentSoC < 90) timeHours += (EV_SPECS.CAPACITY * ((Math.min(targetSoC, 90) - currentSoC) / 100)) / (actualPower * eff);
        if (targetSoC > 90) timeHours += (EV_SPECS.CAPACITY * ((targetSoC - Math.max(currentSoC, 90)) / 100)) / (actualPower * eff * 0.85);
        cost = ((energyNeeded / EV_SPECS.AC_COST_EFFICIENCY) + (timeHours * EV_SPECS.AC_VAMPIRE_DRAIN_KW)) * (Number(pricePerUnit) || 0);
      } else {
        const effDc = actualPower * EV_SPECS.DC_EFFICIENCY;
        if (targetSoC <= 80) timeHours = energyNeeded / effDc;
        else if (currentSoC >= 80) timeHours = energyNeeded / (effDc * EV_SPECS.TRICKLE_RATE);
        else timeHours = ((EV_SPECS.CAPACITY * ((80 - currentSoC) / 100)) / effDc) + ((EV_SPECS.CAPACITY * ((targetSoC - 80) / 100)) / (effDc * EV_SPECS.TRICKLE_RATE));
        cost = (energyNeeded / EV_SPECS.DC_COST_EFFICIENCY) * (Number(pricePerUnit) || 0);
      }
      return { hours: Math.floor(timeHours), minutes: Math.round((timeHours%1)*60), actualPower, bottleneck, error: null, cost };
    };

    const isDuplicateRecord = (item, targetItem) => {
       if (!targetItem) return false;
       return Number(item.timestamp) === Number(targetItem.timestamp) && 
              Math.abs(Number(item.cost) - Number(targetItem.cost)) < 0.05 && 
              Number(item.startSoC) === Number(targetItem.startSoC) && 
              Number(item.targetSoC) === Number(targetItem.targetSoC);
    };

    const Icon = memo(({ name, className = "w-5 h-5" }) => {
      const paths = {
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />, clock: <><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 16 14" /></>,
        save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z" /><polyline points="17 21 17 13 7 13 7 21" /><polyline points="7 3 7 8 15 8" /></>,
        history: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /><path d="M12 7v5l4 2" /></>,
        trash: <><polyline points="3 6 5 6 21 6" /><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" /></>,
        edit: <><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" /><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" /></>,
        user: <><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
        settings: <><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83 2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></>,
        list: <><line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" /></>, chart: <><line x1="18" y1="20" x2="18" y2="10" /><line x1="12" y1="20" x2="12" y2="4" /><line x1="6" y1="20" x2="6" y2="14" /></>,
        chevron: <polyline points="6 9 12 15 18 9" />, download: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>, upload: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></>
      };
      return <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{paths[name]}</svg>;
    });

    const StyledSlider = memo(({ min, max, step = "1", value, onChange, colorCls }) => (
      <input type="range" min={min} max={max} step={step} value={value} onChange={onChange} className={`w-full ${colorCls}`} />
    ));

    function useSystemData(onAlertTriggered) {
      const [user, setUser] = useState(null); const [history, setHistory] = useState([]);
      const [storageMode, setStorageMode] = useState('local'); const [isAuthLoading, setIsAuthLoading] = useState(false);
      
      const loadLocalData = () => {
        try { 
          const parsed = JSON.parse(localStorage.getItem('geely_ex2_history') || '[]');
          setHistory(parsed.map((item, idx) => ({ ...item, id: item.id ? String(item.id) : ('loc_' + (item.timestamp || Date.now()) + '_' + idx) }))); 
        } catch(e){ setHistory([]); } 
        setUser({ uid: 'local_user', isAnonymous: true }); setStorageMode('local');
      };

      useEffect(() => {
        if (!auth) return loadLocalData();
        return onAuthStateChanged(auth, async (u) => {
          if (u) { setUser(u); setStorageMode(u.isAnonymous ? 'local' : 'cloud'); } 
          else { try { await signInAnonymously(auth); } catch (e) { loadLocalData(); } }
        });
      }, []);

      useEffect(() => {
        if (!user || !db || user.isAnonymous) { if (storageMode === 'local' && user?.uid !== 'local_user') loadLocalData(); return; }
        localStorage.removeItem('geely_ex2_history');
        return onSnapshot(collection(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory'), (snapshot) => {
          setHistory(snapshot.docs.map(doc => ({ ...doc.data(), id: String(doc.id) })).sort((a, b) => Number(b.timestamp) - Number(a.timestamp)));
        }, (err) => { console.error(err); setStorageMode('local'); loadLocalData(); });
      }, [user, storageMode]);

      const handleGoogleSignIn = async () => {
        if (!auth) return; setIsAuthLoading(true);
        try {
          const provider = new GoogleAuthProvider();
          if (auth.currentUser?.isAnonymous) {
            try { await linkWithPopup(auth.currentUser, provider); } 
            catch (err) { await signInWithPopup(auth, provider); }
          } else { await signInWithPopup(auth, provider); }
        } catch (e) { if (e.code !== 'auth/popup-closed-by-user') onAlertTriggered({ title: "Login Failed", message: e.message }); } 
        finally { setIsAuthLoading(false); }
      };

      const addRecord = async (record) => {
        if (storageMode === 'cloud' && db && user?.uid && !user.isAnonymous) {
          const newRecord = { id: 'temp_' + Date.now(), ...record };
          setHistory(prev => [newRecord, ...prev].sort((a,b) => Number(b.timestamp) - Number(a.timestamp)));
          addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory'), record).catch(e => {
            if (e.code === 'permission-denied') onAlertTriggered({ title: "Cloud Denied", message: "Firebase Rules Blocked. Please fix Rules." });
          });
        } else {
          const newRecord = { id: 'loc_' + Date.now(), ...record };
          const updated = [newRecord, ...history].sort((a,b) => Number(b.timestamp) - Number(a.timestamp));
          setHistory(updated); localStorage.setItem('geely_ex2_history', JSON.stringify(updated));
        } return true;
      };

      const deleteRecord = async (id, targetItem) => {
        const targetId = String(id).trim();
        setHistory(prev => prev.filter(item => !(String(item.id) === targetId || (targetId.startsWith('loc_') && isDuplicateRecord(item, targetItem)))));
        if (storageMode === 'cloud' && db && user?.uid && !user.isAnonymous) {
           try {
              const snapshot = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory'));
              snapshot.docs.forEach(docSnap => {
                 if (String(docSnap.id) === targetId || isDuplicateRecord(docSnap.data(), targetItem)) deleteDoc(docSnap.ref);
              });
           } catch (e) { onAlertTriggered({ title: "Delete Error", message: e.message }); }
        } else {
           try {
              const filtered = JSON.parse(localStorage.getItem('geely_ex2_history')||'[]').filter(item => !(String(item.id) === targetId || isDuplicateRecord(item, targetItem)));
              localStorage.setItem('geely_ex2_history', JSON.stringify(filtered));
           } catch(e){}
        } return true; 
      };

      const updateRecord = async (id, newCost, newTimestamp, targetItem) => {
        const targetId = String(id).trim(), nCost = Number(newCost) || 0, nTs = Number(newTimestamp) || Date.now();
        setHistory(prev => prev.map(item => (String(item.id) === targetId || isDuplicateRecord(item, targetItem)) ? { ...item, id: targetId, cost: nCost, timestamp: nTs } : item).sort((a,b) => Number(b.timestamp) - Number(a.timestamp)));
        if (storageMode === 'cloud' && db && user?.uid && !user.isAnonymous) {
           try {
              const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory');
              const snapshot = await getDocs(colRef); let found = false;
              snapshot.docs.forEach(docSnap => {
                 if (String(docSnap.id) === targetId || isDuplicateRecord(docSnap.data(), targetItem)) { updateDoc(docSnap.ref, { cost: nCost, timestamp: nTs }); found = true; }
              });
              if (!found && targetItem) { const cRec = { ...targetItem, cost: nCost, timestamp: nTs }; delete cRec.id; addDoc(colRef, cRec); }
           } catch (e) { onAlertTriggered({ title: "Update Error", message: e.message }); }
        } else {
           try {
              const upLocal = JSON.parse(localStorage.getItem('geely_ex2_history')||'[]').map(item => String(item.id) === targetId ? { ...item, cost: nCost, timestamp: nTs } : item);
              localStorage.setItem('geely_ex2_history', JSON.stringify(upLocal));
           } catch(e){}
        } return true;
      };

      const importRecords = async (importedList) => {
        if (!Array.isArray(importedList)) return 0;
        const existSigs = new Set(history.map(i => `${Number(i.timestamp)}_${Number(i.cost).toFixed(2)}`));
        let addedCount = 0; const newLocals = [];
        importedList.forEach(raw => {
          const ts = Number(raw.timestamp)||Date.now(), cost = Number(raw.cost)||0, sig = `${ts}_${cost.toFixed(2)}`;
          if (existSigs.has(sig) || !raw.timestamp) return; existSigs.add(sig);
          const cleanItem = { timestamp: ts, cost, startSoC: Number(raw.startSoC)||0, targetSoC: Number(raw.targetSoC)||100, chargerType: raw.chargerType||'AC', power: raw.power||'10A', pricePerUnit: Number(raw.pricePerUnit)||4.5 };
          if (storageMode === 'cloud' && db && user?.uid && !user.isAnonymous) addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'chargeHistory'), cleanItem);
          else newLocals.push({ id: 'imp_' + Date.now() + Math.random(), ...cleanItem });
          addedCount++;
        });
        if (storageMode === 'local' && newLocals.length > 0) {
          const merged = [...newLocals, ...history].sort((a,b) => Number(b.timestamp) - Number(a.timestamp));
          setHistory(merged); localStorage.setItem('geely_ex2_history', JSON.stringify(merged));
        } return addedCount;
      };

      return { user, history, storageMode, isAuthLoading, handleGoogleSignIn, handleSignOut: () => signOut(auth), addRecord, deleteRecord, updateRecord, importRecords };
    }

    const GaugeCanvas = memo(({ currentSoC, targetSoC, chargerType }) => {
      const canvasRef = useRef(null);
      useEffect(() => {
        const ctx = canvasRef.current?.getContext('2d'); if (!ctx) return;
        const w = 320, h = 160, cx = w/2, cy = h-10, r = w/2-30;
        canvasRef.current.width = w; canvasRef.current.height = h; ctx.clearRect(0, 0, w, h);
        const grad = ctx.createLinearGradient(0, cy, w, cy); grad.addColorStop(0, '#06b6d4'); grad.addColorStop(0.5, '#8b5cf6'); grad.addColorStop(1, '#ec4899');
        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.stroke();
        const cAngle = Math.PI + (Math.PI * (currentSoC / 100));
        ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, cAngle); ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.strokeStyle = grad; ctx.shadowColor = '#ec4899'; ctx.shadowBlur = 12; ctx.stroke(); ctx.shadowBlur = 0;
        if (targetSoC > currentSoC) {
          const tAngle = Math.PI + (Math.PI * (targetSoC / 100));
          ctx.beginPath(); ctx.arc(cx, cy, r, cAngle, tAngle); ctx.lineWidth = 18; ctx.setLineDash([4, 4]);
          const forecastGrad = ctx.createLinearGradient(0, 0, w, 0); forecastGrad.addColorStop(0, '#a855f7'); forecastGrad.addColorStop(1, targetSoC > 80 ? '#fb923c' : '#ec4899');
          ctx.strokeStyle = forecastGrad; ctx.stroke(); ctx.setLineDash([]);
        }
      }, [currentSoC, targetSoC, chargerType]);
      return <canvas ref={canvasRef} className="w-full max-w-[320px] aspect-[2/1] z-10 drop-shadow-2xl" />;
    });

    const AppAlertModal = ({ data, onClose }) => data ? (
      <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm"><div className="bg-[#18152e] border border-white/10 rounded-2xl w-full max-w-sm p-6 text-center shadow-2xl"><h4 className="text-lg font-black text-rose-400 mb-2">{data.title}</h4><p className="text-gray-300 text-sm whitespace-pre-wrap mb-6">{data.message}</p><button onClick={onClose} className="w-full py-2.5 bg-cyan-500 text-black font-bold rounded-xl text-sm">OK</button></div></div>
    ) : null;

    const ConfirmDeleteModal = ({ item, onConfirm, onCancel }) => item ? (
      <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-black/90 backdrop-blur-md"><div className="bg-[#120F24] border border-rose-500/30 rounded-3xl w-full max-w-xs p-6 text-center shadow-[0_0_50px_-12px_rgba(244,63,94,0.4)]"><div className="w-14 h-14 bg-rose-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-rose-500/30"><Icon name="trash" className="w-6 h-6 text-rose-500" /></div><h4 className="text-lg font-black text-white mb-2">ยืนยันการลบ</h4><p className="text-gray-400 text-[11px] mb-6">คุณต้องการลบรายการชาร์จ <span className="text-amber-400 font-mono font-bold text-sm">฿{Number(item.cost).toFixed(2)}</span> ใช่หรือไม่?<br/>(การลบนี้จะนำข้อมูลออกจากระบบถาวร)</p><div className="flex gap-3"><button onClick={onCancel} className="flex-1 py-2.5 bg-white/5 border border-white/10 text-white font-bold rounded-xl text-xs">ยกเลิก</button><button onClick={onConfirm} className="flex-1 py-2.5 bg-rose-500/20 text-rose-400 border border-rose-500/50 font-bold rounded-xl text-xs">ลบทิ้ง</button></div></div></div>
    ) : null;

    const RecordItemCard = ({ item, activeItemId, setActiveItemId, editingId, setEditingId, editCost, setEditCost, editDateTime, setEditDateTime, systemDB, onDeleteRequest }) => {
      const isEditing = String(editingId) === String(item.id), isFocused = String(activeItemId) === String(item.id);
      return (
        <div onClick={() => !isEditing && setActiveItemId(isFocused ? null : String(item.id))} className={`p-3.5 rounded-2xl border transition-all cursor-pointer mb-2 ${isFocused ? 'bg-white/5 border-amber-500/50' : 'bg-black/40 border-white/5'}`}>
          {isEditing ? (
            <div className="space-y-3" onClick={e => e.stopPropagation()}>
              <h4 className="text-xs font-bold text-amber-400 uppercase">แก้ไขรายการชาร์จ</h4>
              <input type="datetime-local" value={editDateTime} onChange={e => setEditDateTime(e.target.value)} className="w-full bg-[#050B14] border border-white/10 text-amber-300 rounded-xl px-3 py-1.5 text-xs font-mono" />
              <div className="flex items-center gap-2"><span className="text-amber-400 font-bold">฿</span><input type="number" step="0.01" value={editCost} onChange={e => setEditCost(e.target.value)} className="w-full bg-[#050B14] border border-white/10 text-amber-300 rounded-xl px-3 py-1.5 text-right font-mono text-sm font-bold" /></div>
              <div className="flex justify-end gap-2 pt-2">
                <button onClick={() => setEditingId(null)} className="px-3.5 py-1.5 bg-white/10 text-xs rounded-lg font-bold">ยกเลิก</button>
                <button onClick={() => { const ts = editDateTime ? new Date(editDateTime).getTime() : item.timestamp; systemDB.updateRecord(item.id, editCost, isNaN(ts)?item.timestamp:ts, item); setEditingId(null); setActiveItemId(null); }} className="px-3.5 py-1.5 bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs rounded-lg font-bold">บันทึก</button>
              </div>
            </div>
          ) : (
            <>
              <div className="flex justify-between items-start">
                <div>
                  <div className="text-[10px] text-white/40 font-bold uppercase mb-1">{new Date(Number(item.timestamp)).toLocaleDateString('th-TH', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })} น.</div>
                  <div className="flex items-center gap-2"><span className={`text-[9px] px-1.5 py-0.5 rounded font-black ${item.chargerType==='DC'?'bg-cyan-500/20 text-cyan-300':'bg-fuchsia-500/20 text-fuchsia-300'}`}>{item.chargerType} {item.power}</span><span className="text-xs font-bold text-white/80">{item.startSoC}% → {item.targetSoC}%</span></div>
                </div><span className="text-base font-black text-amber-300 font-mono">฿{Number(item.cost).toFixed(2)}</span>
              </div>
              {isFocused && (
                <div className="flex justify-end gap-2 mt-2 pt-2 border-t border-white/5" onClick={e => e.stopPropagation()}>
                  <button onClick={() => { setEditingId(String(item.id)); setEditCost(Number(item.cost).toFixed(2)); setEditDateTime(getSafeISODateTime(item.timestamp)); }} className="px-3 py-1.5 bg-blue-500/10 hover:bg-blue-500/20 rounded-lg text-blue-400 flex items-center gap-1 text-[11px] uppercase font-bold border border-blue-500/20"><Icon name="edit" className="w-3.5 h-3.5" /> แก้ไข</button>
                  <button onClick={() => onDeleteRequest(item)} className="px-3 py-1.5 bg-rose-500/10 hover:bg-rose-500/20 rounded-lg text-rose-400 flex items-center gap-1 text-[11px] uppercase font-bold border border-rose-500/20"><Icon name="trash" className="w-3.5 h-3.5" /> ลบ</button>
                </div>
              )}
            </>
          )}
        </div>
      );
    };

    function App() {
      const [appAlert, setAppAlert] = useState(null); const systemDB = useSystemData(setAppAlert);
      const [showHistory, setShowHistory] = useState(false); const [showAuthModal, setShowAuthModal] = useState(false); const [showCalib, setShowCalib] = useState(false);
      const [calibVoltage, setCalibVoltage] = useState(229); const [calibOBC, setCalibOBC] = useState(94);
      const [currentSoC, setCurrentSoC] = useState(30); const [targetSoC, setTargetSoC] = useState(80);
      const [chargerType, setChargerType] = useState('AC'); const [dcPower, setDcPower] = useState(120); const [acPower, setAcPower] = useState(7);
      const [acInputMode, setAcInputMode] = useState('A'); const [acAmps, setAcAmps] = useState(10);
      const [scheduleMode, setScheduleMode] = useState('START_AT'); const [targetTime, setTargetTime] = useState('06:30'); const [userStartTime, setUserStartTime] = useState(getCurrentTimeStr());
      const [pricePerUnit, setPricePerUnit] = useState(4.5);
      
      const getMonthKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; };
      const [historyTab, setHistoryTab] = useState("records"); const [selectedMonthFilter, setSelectedMonthFilter] = useState(getMonthKey()); const [expandedMonthKey, setExpandedMonthKey] = useState(null);
      const [activeItemId, setActiveItemId] = useState(null); const [editingId, setEditingId] = useState(null); const [editCost, setEditCost] = useState(""); const [editDateTime, setEditDateTime] = useState("");
      const [isSaving, setIsSaving] = useState(false); const [itemToDelete, setItemToDelete] = useState(null);

      const calcDetails = useMemo(() => calculateChargeStats(currentSoC, targetSoC, chargerType, dcPower, acPower, acInputMode, acAmps, pricePerUnit, calibVoltage, calibOBC), [currentSoC, targetSoC, chargerType, dcPower, acPower, acInputMode, acAmps, pricePerUnit, calibVoltage, calibOBC]);

      const handleRecalculateOldData = async () => {
        if (!confirm("คำนวณราคาใหม่ด้วยสูตรล่าสุด?")) return; setIsSaving(true); let updated = 0;
        try {
          for (const item of systemDB.history) {
            const stats = calculateChargeStats(item.startSoC||0, item.targetSoC||100, item.chargerType||'AC', parseFloat(item.power)||120, parseFloat(item.power)||7, String(item.power).includes('A')?'A':'kW', parseInt(item.power)||10, item.pricePerUnit||4.5, calibVoltage, calibOBC);
            if (!stats.error && Math.abs(stats.cost - (Number(item.cost)||0)) > 0.1) { await systemDB.updateRecord(item.id, stats.cost, item.timestamp, item); updated++; }
          } setAppAlert({ title: "อัปเดตสำเร็จ", message: `คำนวณค่าไฟใหม่ ${updated} รายการ` });
        } catch(e) { setAppAlert({ title: "Error", message: e.message }); } finally { setIsSaving(false); setShowCalib(false); }
      };

      const groupedHistory = useMemo(() => {
        const groups = {};
        systemDB.history.forEach(item => {
          const d = new Date(Number(item.timestamp)); const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
          if (!groups[key]) groups[key] = { key, label: d.toLocaleDateString('th-TH', { month: 'long', year: 'numeric' }), items: [], total: 0 };
          groups[key].items.push(item); groups[key].total += Number(item.cost)||0;
        });
        return Object.values(groups).sort((a, b) => b.key.localeCompare(a.key));
      }, [systemDB.history]);

      const filteredRecords = groupedHistory.find(g => g.key === selectedMonthFilter)?.items || [];
      const filteredTotalCost = filteredRecords.reduce((sum, item) => sum + (Number(item.cost)||0), 0);
      const acPresets = [ {l: 'บ้าน Off-Peak', v: 2.6}, {l: 'ไฟบ้านปกติ', v: 4.5}, {l: 'บ้าน On-Peak', v: 5.8}, {l: 'AC สาธารณะ', v: 5.9} ];
      const dcPresets = [7.9, 8.2, 8.4, 9.4].includes(pricePerUnit) ? [ {l: 'ตู้ 40-180kW', v: 7.9}, {l: 'ตู้ 180-200', v: 8.2}, {l: 'EV HUB/Fast', v: 8.4}, {l: 'Ultra 240+', v: 9.4} ] : [ {l: 'PEA (ถูกสุด)', v: 4.5}, {l: 'PEA / PluZ', v: 5.5}, {l: 'ReverCharger', v: 5.8}, {l: 'PluZ / Easy', v: 5.9} ];

      return (
        <div className="min-h-screen flex items-center justify-center p-4 bg-[#0B0A1A] bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-fuchsia-900/40 via-[#0B0A1A] to-cyan-900/30">
          <AppAlertModal data={appAlert} onClose={() => setAppAlert(null)} />
          <div className="bg-[#120F24]/60 backdrop-blur-3xl w-full max-w-md rounded-[32px] border border-white/10 p-6 space-y-6 shadow-[0_0_80px_-20px_rgba(236,72,153,0.3)]">
            <div className="flex justify-between items-center border-b border-white/5 pb-4">
              <div>
                <h1 className="text-2xl font-black flex items-center gap-2"><Icon name="zap" className="text-fuchsia-400 drop-shadow-[0_0_12px_rgba(236,72,153,0.8)]" /><span className="bg-clip-text text-transparent bg-gradient-to-r from-cyan-300 via-fuchsia-400 to-pink-500">Geely EX2</span></h1>
                <p className="text-[10px] text-purple-200/60 uppercase font-bold tracking-wider">HyperCharge Tracker</p>
              </div>
              <div className="flex gap-2">
                <button onClick={() => setShowAuthModal(true)} className={`p-2.5 rounded-xl border relative ${systemDB.storageMode==='cloud' ? 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300' : 'bg-white/5 border-white/10 text-cyan-300'}`}><Icon name="user" />{systemDB.storageMode==='cloud' && <span className="absolute top-1 right-1 w-2 h-2 bg-emerald-400 rounded-full animate-ping"></span>}</button>
                <button onClick={() => setShowCalib(!showCalib)} className={`p-2.5 rounded-xl border ${showCalib ? 'bg-fuchsia-500/20 border-fuchsia-500/50 text-fuchsia-300' : 'bg-white/5 border-white/10 text-cyan-300'}`}><Icon name="settings" /></button>
                <button onClick={() => { setShowHistory(true); setActiveItemId(null); }} className="p-2.5 bg-white/5 rounded-xl border border-white/10 text-cyan-300 relative"><Icon name="history" />{systemDB.history.length > 0 && <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-fuchsia-500 rounded-full animate-pulse border border-[#120F24]"></span>}</button>
              </div>
            </div>

            {showCalib && (
              <div className="p-4 bg-gradient-to-b from-[#18152e] to-[#120F24] rounded-2xl border border-white/10 space-y-3">
                <div className="flex justify-between items-center border-b border-white/5 pb-2"><span className="text-xs font-black text-fuchsia-400 uppercase flex items-center gap-1.5"><Icon name="settings" className="w-4 h-4" /> ปรับแก้แรงดันไฟ</span><button onClick={() => { setCalibVoltage(229); setCalibOBC(94); }} className="text-[10px] text-cyan-300 bg-cyan-500/10 px-2 py-0.5 rounded border border-cyan-500/20">คืนค่าโรงงาน</button></div>
                <div><div className="flex justify-between text-xs text-gray-300 mb-1"><span>Voltage (AC)</span><span className="text-cyan-400 font-mono font-bold">{calibVoltage} V</span></div><StyledSlider min="200" max="240" value={calibVoltage} onChange={e=>setCalibVoltage(Number(e.target.value))} colorCls="text-cyan-500" /></div>
                <div><div className="flex justify-between text-xs text-gray-300 mb-1"><span>OBC Efficiency</span><span className="text-fuchsia-400 font-mono font-bold">{calibOBC}%</span></div><StyledSlider min="75" max="98" value={calibOBC} onChange={e=>setCalibOBC(Number(e.target.value))} colorCls="text-fuchsia-500" /></div>
                <div className="pt-3 border-t border-white/5 mt-3"><button onClick={handleRecalculateOldData} disabled={isSaving || !systemDB.history.length} className="w-full py-2 bg-amber-500/10 text-amber-300 border border-amber-500/30 rounded-xl text-[10px] font-bold uppercase flex justify-center gap-2 disabled:opacity-50"><Icon name="history" className="w-3.5 h-3.5" /> อัปเดตประวัติด้วยสูตรใหม่</button></div>
              </div>
            )}

            <div className="flex flex-col items-center">
              <div className="relative w-full flex justify-center mb-2"><GaugeCanvas currentSoC={currentSoC} targetSoC={targetSoC} chargerType={chargerType} /><div className="absolute bottom-0 left-1/2 -translate-x-1/2 text-center z-10"><span className="text-[38px] leading-none font-black text-transparent bg-clip-text bg-gradient-to-b from-white to-pink-200">{targetSoC}%</span></div></div>
              {calcDetails.error ? <div className="text-lg font-bold text-rose-400 my-2 bg-rose-500/10 px-4 py-1.5 rounded-xl border border-rose-500/20">{calcDetails.error}</div> : <div className="text-[52px] leading-none font-black text-white font-mono tracking-tight my-1 drop-shadow-lg">{calcDetails.hours > 0 && <span>{calcDetails.hours}<span className="text-lg text-fuchsia-300 font-normal ml-1 mr-2">ชม.</span></span>}<span>{calcDetails.minutes}<span className="text-lg text-fuchsia-300 font-normal ml-1">นาที</span></span></div>}
              <div className="w-full bg-gradient-to-r from-fuchsia-900/20 to-purple-900/20 rounded-2xl p-3 border border-fuchsia-500/20 flex items-center gap-3"><div className="p-2 bg-fuchsia-500/20 rounded-xl border border-fuchsia-500/30"><Icon name="zap" className="w-4 h-4 text-fuchsia-300" /></div><div className="text-xs"><div className="text-purple-200">กำลังไฟเข้า: <span className="font-black text-cyan-400 text-sm">{calcDetails.actualPower.toFixed(1)} kW</span></div><div className="text-fuchsia-400/80 text-[10px] uppercase">{calcDetails.bottleneck}</div></div></div>
            </div>

            <div className="space-y-4">
              <div><div className="flex justify-between items-center text-xs font-bold text-purple-200 mb-2 uppercase"><span>แบตเตอรี่ปัจจุบัน</span><span className="text-cyan-400 font-black bg-cyan-500/10 px-2 rounded border border-cyan-500/20">{currentSoC}%</span></div><StyledSlider min="0" max="100" value={currentSoC} onChange={e=>setCurrentSoC(Number(e.target.value))} colorCls="text-cyan-400" /></div>
              <div><div className="flex justify-between items-center text-xs font-bold text-purple-200 mb-2 uppercase"><span>เป้าหมายการชาร์จ</span><span className="text-fuchsia-400 font-black bg-fuchsia-500/10 px-2 rounded border border-fuchsia-500/20">{targetSoC}%</span></div><StyledSlider min="0" max="100" value={targetSoC} onChange={e=>setTargetSoC(Number(e.target.value))} colorCls="text-fuchsia-400" /></div>
            </div>

            <div className="space-y-3">
              <div className="flex bg-black/40 p-1 rounded-xl border border-white/5"><button onClick={() => { setChargerType('AC'); setPricePerUnit(4.5); }} className={`flex-1 py-2.5 text-xs font-bold rounded-lg ${chargerType==='AC'?'bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white shadow-md':'text-purple-400/60'}`}>AC (ธรรมดา)</button><button onClick={() => { setChargerType('DC'); setPricePerUnit(5.9); }} className={`flex-1 py-2.5 text-xs font-bold rounded-lg ${chargerType==='DC'?'bg-gradient-to-r from-cyan-600 to-blue-600 text-white shadow-md':'text-purple-400/60'}`}>DC (ชาร์จเร็ว)</button></div>
              {chargerType === 'AC' ? (
                <><div className="flex gap-2"><button onClick={()=>setAcInputMode('kW')} className={`flex-1 py-1.5 text-[10px] font-bold uppercase rounded-lg border ${acInputMode==='kW'?'bg-white/10 border-white/20 text-white':'border-white/5 text-purple-400/50'}`}>ตู้ชาร์จ (kW)</button><button onClick={()=>setAcInputMode('A')} className={`flex-1 py-1.5 text-[10px] font-bold uppercase rounded-lg border ${acInputMode==='A'?'bg-white/10 border-white/20 text-white':'border-white/5 text-purple-400/50'}`}>สายพกพา (Amps)</button></div>
                {acInputMode === 'A' ? (
                  <div className="space-y-2"><div className="flex justify-between items-center text-xs font-bold text-purple-200"><span>กระแสชาร์จ</span><span className="text-fuchsia-400 font-mono font-black">{acAmps}A</span></div><StyledSlider min="6" max="32" value={acAmps} onChange={e=>setAcAmps(Number(e.target.value))} colorCls="text-fuchsia-500" /></div>
                ) : (
                  <div className="space-y-2"><div className="flex justify-between items-center text-xs font-bold text-purple-200"><span>กำลังไฟชาร์จ</span><span className="text-cyan-400 font-mono font-black">{acPower.toFixed(1)} kW</span></div><StyledSlider min="1.0" max="22.0" step="0.1" value={acPower} onChange={e=>setAcPower(Number(e.target.value))} colorCls="text-cyan-500" /></div>
                )}</>
              ) : (
                <div className="space-y-3"><StyledSlider min="10" max="360" step="5" value={dcPower} onChange={e=>setDcPower(Number(e.target.value))} colorCls="text-cyan-500" /></div>
              )}
            </div>

            <div className="bg-[#0f172a]/90 p-5 rounded-2xl border border-white/10 text-center">
              <span className="text-xs font-bold text-emerald-400 uppercase block mb-1">ประมาณการค่าไฟ</span>
              <span className="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white via-teal-200 to-emerald-400 font-mono block mb-4">฿{calcDetails.cost.toFixed(2)}</span>
              <input type="number" step="0.01" value={pricePerUnit} onChange={e=>setPricePerUnit(Number(e.target.value))} className="w-28 mx-auto bg-[#050B14] border border-white/10 text-emerald-300 rounded-xl px-3 py-2 text-center font-mono text-lg font-black block mb-3" />
              <div className="grid grid-cols-4 gap-1 mb-3">{(chargerType==='AC'?acPresets:dcPresets).map(p=><button key={p.l} onClick={()=>setPricePerUnit(p.v)} className={`py-1.5 px-0.5 text-[7px] font-bold rounded border ${pricePerUnit===p.v?'bg-emerald-500 text-black':'bg-black/40 border-white/5 text-emerald-400/70'}`}><span className="block truncate">{p.l}</span><span className="block font-black">฿{p.v}</span></button>)}</div>
              <button onClick={() => systemDB.addRecord({ timestamp: Date.now(), cost: calcDetails.cost, startSoC: currentSoC, targetSoC, chargerType, power: chargerType==='AC'?(acInputMode==='A'?`${acAmps}A`:`${acPower}kW`):`${dcPower}kW`, pricePerUnit })} disabled={calcDetails.error || !systemDB.user} className="w-full py-2.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-xl text-xs font-bold uppercase flex justify-center gap-2"><Icon name="save" className="w-4 h-4" /> บันทึกยอดชาร์จลงประวัติ</button>
            </div>
          </div>

          {showHistory && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-[#120F24] border border-white/10 w-full max-w-md h-[85vh] flex flex-col rounded-[32px] overflow-hidden shadow-2xl">
                <div className="p-4 bg-white/5 border-b border-white/5 flex justify-between items-center"><div className="flex items-center gap-2 text-cyan-400 font-bold uppercase text-xs"><Icon name="history" /> ประวัติการชาร์จ</div><button onClick={() => setShowHistory(false)} className="text-white/50 text-xl font-bold">✕</button></div>
                <div className="px-4 py-2.5 bg-black/20 border-b border-white/5 flex gap-2">
                  <button onClick={() => { const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(systemDB.history)); a.download = `backup_${Date.now()}.json`; a.click(); }} className="flex-1 py-1.5 bg-cyan-500/10 text-cyan-300 border border-cyan-500/20 rounded-lg text-[10px] font-bold uppercase flex justify-center gap-1.5"><Icon name="upload" className="w-3.5 h-3.5" /> สำรองข้อมูล (Export)</button>
                  <label className="flex-1 py-1.5 bg-purple-500/10 text-purple-300 border border-purple-500/20 rounded-lg text-[10px] font-bold uppercase flex justify-center gap-1.5 cursor-pointer m-0"><Icon name="download" className="w-3.5 h-3.5" /> นำเข้าข้อมูล (Import)<input type="file" onChange={e=>{ const f = e.target.files?.[0]; if(f){ const r = new FileReader(); r.onload=ev=>systemDB.importRecords(JSON.parse(ev.target.result)).then(c=>setAppAlert({title:"สำเร็จ",message:`นำเข้า ${c} รายการ`})); r.readAsText(f); } }} className="hidden" /></label>
                </div>
                <div className="px-4 py-3 bg-white/5 border-b border-white/5 space-y-3">
                  <div className="flex bg-black/40 p-0.5 rounded-xl text-xs font-bold">
                    <button onClick={() => setHistoryTab('records')} className={`flex-1 py-2 rounded-lg flex justify-center gap-1.5 ${historyTab==='records'?'bg-cyan-500 text-black':'text-gray-400'}`}><Icon name="list" className="w-3.5 h-3.5" /> {groupedHistory.find(g => g.key === selectedMonthFilter)?.label || 'รายการชาร์จ'}</button>
                    <button onClick={() => setHistoryTab('summary')} className={`flex-1 py-2 rounded-lg flex justify-center gap-1.5 ${historyTab==='summary'?'bg-cyan-500 text-black':'text-gray-400'}`}><Icon name="chart" className="w-3.5 h-3.5" /> สรุปรายเดือน</button>
                  </div>
                  {historyTab === 'records' && (
                    <div className="flex bg-black/30 p-1.5 rounded-xl border border-white/5 text-xs"><select value={selectedMonthFilter} onChange={e=>setSelectedMonthFilter(e.target.value)} className="w-full bg-[#050B14] border border-white/10 text-cyan-300 rounded-lg px-3 py-1.5 text-xs font-bold font-mono outline-none text-center">{groupedHistory.map(g => <option key={g.key} value={g.key}>{g.label} ({g.items.length} รายการ)</option>)}</select></div>
                  )}
                </div>
                <div className="flex-1 overflow-y-auto p-4 space-y-3 history-scroll">
                  {historyTab === 'records' ? (
                    <div>
                      <div className="flex justify-between text-xs font-bold text-cyan-300 uppercase border-b border-white/10 pb-2 mb-3"><span>{groupedHistory.find(g=>g.key===selectedMonthFilter)?.label||'ไม่มีข้อมูล'}</span><span className="font-mono text-emerald-400">฿{filteredTotalCost.toFixed(2)}</span></div>
                      {filteredRecords.map(item => <RecordItemCard key={item.id} item={item} activeItemId={activeItemId} setActiveItemId={setActiveItemId} editingId={editingId} setEditingId={setEditingId} editCost={editCost} setEditCost={setEditCost} editDateTime={editDateTime} setEditDateTime={setEditDateTime} systemDB={systemDB} onDeleteRequest={setItemToDelete} />)}
                    </div>
                  ) : (
                    groupedHistory.map(group => (
                      <div key={group.key} className="bg-black/40 border border-white/5 rounded-2xl overflow-hidden">
                        <div onClick={()=>setExpandedMonthKey(expandedMonthKey===group.key?null:group.key)} className="p-4 flex justify-between items-center cursor-pointer hover:bg-white/5"><div><span className="text-[9px] text-cyan-400 font-bold uppercase block">สรุปรายเดือน</span><h3 className="text-sm font-black">{group.label}</h3></div><div className="flex items-center gap-2"><span className="text-base font-black font-mono text-emerald-400">฿{group.total.toFixed(2)}</span><Icon name="chevron" className={`w-4 h-4 text-gray-400 transition-transform ${expandedMonthKey===group.key?'rotate-180':''}`} /></div></div>
                        {expandedMonthKey === group.key && <div className="p-3 bg-[#0a0815]/60 space-y-2">{group.items.map(item => <RecordItemCard key={item.id} item={item} activeItemId={activeItemId} setActiveItemId={setActiveItemId} editingId={editingId} setEditingId={setEditingId} editCost={editCost} setEditCost={setEditCost} editDateTime={editDateTime} setEditDateTime={setEditDateTime} systemDB={systemDB} onDeleteRequest={setItemToDelete} />)}</div>}
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          <ConfirmDeleteModal item={itemToDelete} onConfirm={() => { systemDB.deleteRecord(itemToDelete.id, itemToDelete); setActiveItemId(null); setEditingId(null); setItemToDelete(null); }} onCancel={() => setItemToDelete(null)} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script type="module">
    try { const compiled = Babel.transform(document.getElementById('jsx-source').textContent, { presets: [['react', { "runtime": "classic" }]], sourceType: "module" }).code; const script = document.createElement('script'); script.type = 'module'; script.text = compiled; document.body.appendChild(script); } catch (e) { console.error(e); }
  </script>
</body>
